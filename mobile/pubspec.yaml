name: qyic
description: Qyic — spaced repetition that plays like a game.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  path: ^1.9.1
  file_selector: ^1.1.0
  protobuf: ^6.1.0
  # Int64 in the generated protobuf code.
  fixnum: ^1.1.1
  archive: ^4.5.2
  crypto: ^3.0.8
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    # SIL OFL 1.1 texts, shown on the licenses page.
    - assets/fonts/SpaceGrotesk-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
