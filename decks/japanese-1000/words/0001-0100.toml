  { term = "嫌い", reading = "きらい · kirai", meaning = "disliked / to dislike", pos = "adjective", sentence = "私は野菜が[嫌い|きらい|kirai]です。", translation = "I dislike vegetables.", note = "na-adjective · the disliked thing takes が" },
