  { term = "少し", reading = "すこし · sukoshi", meaning = "a little / a few", pos = "adverb", sentence = "日本語が[少し|すこし|sukoshi]話せます。", translation = "I can speak a little Japanese." },
  { term = "たくさん", reading = "takusan", meaning = "a lot / many", pos = "adverb", sentence = "冷蔵庫に卵が[たくさん|takusan]あります。", translation = "There are lots of eggs in the fridge." },
  { term = "名前", reading = "なまえ · namae", meaning = "name", pos = "noun", sentence = "お[名前|なまえ|namae]は何ですか。", translation = "What is your name?" },
  { term = "電話", reading = "でんわ · denwa", meaning = "telephone / phone call", pos = "noun", sentence = "夜、母に[電話|でんわ|denwa]します。", translation = "I call my mother at night.", note = "電話する = to phone" },
  { term = "駅", reading = "えき · eki", meaning = "station", pos = "noun", sentence = "[駅|えき|eki]まで歩いて十分です。", translation = "It's a ten-minute walk to the station." },
  { term = "そして", reading = "soshite", meaning = "and / and then", pos = "conjunction", sentence = "朝ご飯を食べました。[そして|soshite]、学校に行きました。", translation = "I ate breakfast. And then I went to school." },
  { term = "でも", reading = "demo", meaning = "but / however", pos = "conjunction", sentence = "この服は好きです。[でも|demo]、高いです。", translation = "I like these clothes. But they're expensive." },
  { term = "本", reading = "ほん · hon", meaning = "book", pos = "noun", sentence = "図書館で[本|ほん|hon]を借りました。", translation = "I borrowed a book from the library." },
