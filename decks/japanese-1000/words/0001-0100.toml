  { term = "明日", reading = "あした · ashita", meaning = "tomorrow", pos = "noun", sentence = "[明日|あした|ashita]また来ます。", translation = "I will come again tomorrow." },
  { term = "昨日", reading = "きのう · kinou", meaning = "yesterday", pos = "noun", sentence = "[昨日|きのう|kinou]は雨でした。", translation = "It rained yesterday." },
  { term = "今", reading = "いま · ima", meaning = "now", pos = "noun", sentence = "[今|いま|ima]、忙しいですか。", translation = "Are you busy now?" },
  { term = "いい", reading = "ii", meaning = "good", pos = "adjective", sentence = "この映画はとても[いい|ii]です。", translation = "This movie is very good.", note = "i-adjective (irregular) · past: よかった · negative: よくない" },
  { term = "大きい", reading = "おおきい · ookii", meaning = "big / large", pos = "adjective", sentence = "あの[大きい|おおきい|ookii]建物は病院です。", translation = "That big building is a hospital.", note = "i-adjective" },
  { term = "小さい", reading = "ちいさい · chiisai", meaning = "small / little", pos = "adjective", sentence = "この靴は少し[小さい|ちいさい|chiisai]です。", translation = "These shoes are a little small.", note = "i-adjective" },
  { term = "新しい", reading = "あたらしい · atarashii", meaning = "new", pos = "adjective", sentence = "[新しい|あたらしい|atarashii]車を買いました。", translation = "I bought a new car.", note = "i-adjective" },
