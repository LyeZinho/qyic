words = [
  { term = "私", reading = "わたし · watashi", meaning = "I / me", pos = "pronoun", sentence = "[私|わたし|watashi]は学生です。", translation = "I am a student.", note = "neutral, polite 'I'" },
  { term = "あなた", reading = "anata", meaning = "you", pos = "pronoun", sentence = "[あなた|anata]の名前は何ですか。", translation = "What is your name?", note = "often avoided; use the person's name instead" },
  { term = "彼", reading = "かれ · kare", meaning = "he / boyfriend", pos = "pronoun", sentence = "[彼|かれ|kare]は私の友達です。", translation = "He is my friend." },
  { term = "彼女", reading = "かのじょ · kanojo", meaning = "she / girlfriend", pos = "pronoun", sentence = "[彼女|かのじょ|kanojo]は先生です。", translation = "She is a teacher." },
  { term = "これ", reading = "kore", meaning = "this (thing near me)", pos = "pronoun", sentence = "[これ|kore]は私の本です。", translation = "This is my book." },
  { term = "それ", reading = "sore", meaning = "that (thing near you)", pos = "pronoun", sentence = "[それ|sore]は何ですか。", translation = "What is that?" },
  { term = "あれ", reading = "are", meaning = "that (thing over there)", pos = "pronoun", sentence = "[あれ|are]は駅です。", translation = "That over there is the station." },
  { term = "どれ", reading = "dore", meaning = "which one (of three or more)", pos = "pronoun", sentence = "[どれ|dore]がいいですか。", translation = "Which one is good?" },
  { term = "ここ", reading = "koko", meaning = "here / this place", pos = "pronoun", sentence = "[ここ|koko]は私の学校です。", translation = "This is my school." },
  { term = "そこ", reading = "soko", meaning = "there (near you)", pos = "pronoun", sentence = "[そこ|soko]に座ってください。", translation = "Please sit there." },
  { term = "あそこ", reading = "asoko", meaning = "over there", pos = "pronoun", sentence = "トイレは[あそこ|asoko]です。", translation = "The toilet is over there." },
  { term = "どこ", reading = "doko", meaning = "where", pos = "pronoun", sentence = "駅は[どこ|doko]ですか。", translation = "Where is the station?" },
  { term = "何", reading = "なに · nani", meaning = "what", pos = "pronoun", sentence = "これは[何|なん|nan]ですか。", translation = "What is this?", note = "read なん before d, n, t sounds: 何ですか" },
  { term = "誰", reading = "だれ · dare", meaning = "who", pos = "pronoun", sentence = "あの人は[誰|だれ|dare]ですか。", translation = "Who is that person?" },
  { term = "いつ", reading = "itsu", meaning = "when", pos = "pronoun", sentence = "誕生日は[いつ|itsu]ですか。", translation = "When is your birthday?" },
  { term = "どう", reading = "dou", meaning = "how / in what way", pos = "adverb", sentence = "日本の生活は[どう|dou]ですか。", translation = "How is life in Japan?" },
  { term = "なぜ", reading = "naze", meaning = "why (formal)", pos = "adverb", sentence = "[なぜ|naze]遅れたのですか。", translation = "Why were you late?" },
  { term = "いくら", reading = "ikura", meaning = "how much (price)", pos = "adverb", sentence = "このかばんは[いくら|ikura]ですか。", translation = "How much is this bag?" },
  { term = "は", reading = "wa", meaning = "topic marker", pos = "particle", sentence = "兄[は|wa]医者です。", translation = "My older brother is a doctor.", note = "written は, pronounced wa" },
  { term = "が", reading = "ga", meaning = "subject marker", pos = "particle", sentence = "雨[が|ga]降っています。", translation = "It is raining." },
  { term = "を", reading = "o", meaning = "direct object marker", pos = "particle", sentence = "水[を|o]飲みます。", translation = "I drink water.", note = "written を, pronounced o" },
  { term = "に", reading = "ni", meaning = "to / at (a time) / in (location of existence)", pos = "particle", sentence = "友達[に|ni]手紙を書きます。", translation = "I write a letter to a friend." },
  { term = "で", reading = "de", meaning = "at (place of action) / by means of", pos = "particle", sentence = "図書館[で|de]勉強します。", translation = "I study at the library." },
  { term = "へ", reading = "e", meaning = "toward / to (direction)", pos = "particle", sentence = "日本[へ|e]行きます。", translation = "I will go to Japan.", note = "written へ, pronounced e" },
  { term = "と", reading = "to", meaning = "and (between nouns) / with", pos = "particle", sentence = "友達[と|to]映画を見ます。", translation = "I watch a movie with a friend." },
  { term = "も", reading = "mo", meaning = "also / too", pos = "particle", sentence = "私[も|mo]行きます。", translation = "I will go too." },
  { term = "の", reading = "no", meaning = "possessive marker ('s / of)", pos = "particle", sentence = "これは私[の|no]かばんです。", translation = "This is my bag." },
  { term = "か", reading = "ka", meaning = "question marker", pos = "particle", sentence = "お茶を飲みます[か|ka]。", translation = "Will you have some tea?" },
  { term = "から", reading = "kara", meaning = "from / because", pos = "particle", sentence = "仕事は九時[から|kara]です。", translation = "Work starts at nine." },
  { term = "まで", reading = "made", meaning = "until / up to / as far as", pos = "particle", sentence = "駅[まで|made]歩きます。", translation = "I walk to the station." },
  { term = "です", reading = "desu", meaning = "to be (polite copula)", pos = "phrase", sentence = "これはペン[です|desu]。", translation = "This is a pen.", note = "plain: だ · past: でした" },
  { term = "ある", reading = "aru", meaning = "to be, exist (things)", pos = "verb", sentence = "机の上に本が[あります|arimasu]。", translation = "There is a book on the desk.", note = "u-verb · polite: あります · negative: ない" },
  { term = "いる", reading = "iru", meaning = "to be, exist (living things)", pos = "verb", sentence = "公園に子供が[います|imasu]。", translation = "There are children in the park.", note = "ru-verb · polite: います" },
  { term = "する", reading = "suru", meaning = "to do", pos = "verb", sentence = "毎日宿題を[します|shimasu]。", translation = "I do homework every day.", note = "irregular · polite: します" },
  { term = "行く", reading = "いく · iku", meaning = "to go", pos = "verb", sentence = "明日、学校に[行きます|いきます|ikimasu]。", translation = "I will go to school tomorrow.", note = "u-verb · polite: 行きます · te-form: 行って" },
  { term = "来る", reading = "くる · kuru", meaning = "to come", pos = "verb", sentence = "友達が家に[来ます|きます|kimasu]。", translation = "A friend is coming to my house.", note = "irregular · polite: 来ます" },
  { term = "食べる", reading = "たべる · taberu", meaning = "to eat", pos = "verb", sentence = "毎朝パンを[食べます|たべます|tabemasu]。", translation = "I eat bread every morning.", note = "ru-verb · polite: 食べます" },
  { term = "飲む", reading = "のむ · nomu", meaning = "to drink / to take (medicine)", pos = "verb", sentence = "朝、コーヒーを[飲みます|のみます|nomimasu]。", translation = "I drink coffee in the morning.", note = "u-verb · polite: 飲みます" },
  { term = "見る", reading = "みる · miru", meaning = "to see / to watch / to look", pos = "verb", sentence = "夜、テレビを[見ます|みます|mimasu]。", translation = "I watch TV at night.", note = "ru-verb · polite: 見ます" },
  { term = "聞く", reading = "きく · kiku", meaning = "to listen / to hear / to ask", pos = "verb", sentence = "毎日音楽を[聞きます|ききます|kikimasu]。", translation = "I listen to music every day.", note = "u-verb · polite: 聞きます" },
  { term = "話す", reading = "はなす · hanasu", meaning = "to speak / to talk", pos = "verb", sentence = "母と電話で[話します|はなします|hanashimasu]。", translation = "I talk with my mother on the phone.", note = "u-verb · polite: 話します" },
  { term = "言う", reading = "いう · iu", meaning = "to say", pos = "verb", sentence = "もう一度[言って|いって|itte]ください。", translation = "Please say it once more.", note = "u-verb · polite: 言います · te-form: 言って" },
  { term = "読む", reading = "よむ · yomu", meaning = "to read", pos = "verb", sentence = "毎晩、本を[読みます|よみます|yomimasu]。", translation = "I read a book every night.", note = "u-verb · polite: 読みます" },
  { term = "書く", reading = "かく · kaku", meaning = "to write", pos = "verb", sentence = "ここに名前を[書いて|かいて|kaite]ください。", translation = "Please write your name here.", note = "u-verb · polite: 書きます · te-form: 書いて" },
  { term = "分かる", reading = "わかる · wakaru", meaning = "to understand", pos = "verb", sentence = "この言葉の意味が[分かります|わかります|wakarimasu]か。", translation = "Do you understand the meaning of this word?", note = "u-verb · polite: 分かります · takes が" },
  { term = "知る", reading = "しる · shiru", meaning = "to know / to come to know", pos = "verb", sentence = "その人を[知って|しって|shitte]いますか。", translation = "Do you know that person?", note = "u-verb · 'I know' = 知っています" },
  { term = "思う", reading = "おもう · omou", meaning = "to think / to believe", pos = "verb", sentence = "明日は雨だと[思います|おもいます|omoimasu]。", translation = "I think it will rain tomorrow.", note = "u-verb · polite: 思います" },
  { term = "買う", reading = "かう · kau", meaning = "to buy", pos = "verb", sentence = "スーパーで野菜を[買いました|かいました|kaimashita]。", translation = "I bought vegetables at the supermarket.", note = "u-verb · polite: 買います" },
  { term = "待つ", reading = "まつ · matsu", meaning = "to wait", pos = "verb", sentence = "駅で友達を[待って|まって|matte]います。", translation = "I am waiting for a friend at the station.", note = "u-verb · polite: 待ちます · te-form: 待って" },
  { term = "帰る", reading = "かえる · kaeru", meaning = "to return home / to go back", pos = "verb", sentence = "六時に家に[帰ります|かえります|kaerimasu]。", translation = "I go home at six.", note = "u-verb (despite -eru) · polite: 帰ります" },
  { term = "寝る", reading = "ねる · neru", meaning = "to sleep / to go to bed", pos = "verb", sentence = "毎晩十一時に[寝ます|ねます|nemasu]。", translation = "I go to bed at eleven every night.", note = "ru-verb · polite: 寝ます" },
  { term = "起きる", reading = "おきる · okiru", meaning = "to get up / to wake up", pos = "verb", sentence = "今朝は七時に[起きました|おきました|okimashita]。", translation = "I got up at seven this morning.", note = "ru-verb · polite: 起きます" },
  { term = "会う", reading = "あう · au", meaning = "to meet", pos = "verb", sentence = "駅で友達に[会いました|あいました|aimashita]。", translation = "I met a friend at the station.", note = "u-verb · polite: 会います · takes に" },
  { term = "使う", reading = "つかう · tsukau", meaning = "to use", pos = "verb", sentence = "このパソコンを[使って|つかって|tsukatte]もいいですか。", translation = "May I use this computer?", note = "u-verb · polite: 使います" },
  { term = "作る", reading = "つくる · tsukuru", meaning = "to make", pos = "verb", sentence = "日曜日にケーキを[作りました|つくりました|tsukurimashita]。", translation = "I made a cake on Sunday.", note = "u-verb · polite: 作ります" },
  { term = "はい", reading = "hai", meaning = "yes", pos = "interjection", sentence = "[はい|hai]、分かりました。", translation = "Yes, I understand." },
  { term = "いいえ", reading = "iie", meaning = "no", pos = "interjection", sentence = "[いいえ|iie]、違います。", translation = "No, that's not right." },
  { term = "こんにちは", reading = "konnichiwa", meaning = "hello / good afternoon", pos = "phrase", sentence = "先生、[こんにちは|konnichiwa]。", translation = "Hello, teacher.", note = "final は is pronounced wa" },
  { term = "おはようございます", reading = "ohayou gozaimasu", meaning = "good morning (polite)", pos = "phrase", sentence = "皆さん、[おはようございます|ohayou gozaimasu]。", translation = "Good morning, everyone.", note = "casual: おはよう" },
  { term = "こんばんは", reading = "konbanwa", meaning = "good evening", pos = "phrase", sentence = "[こんばんは|konbanwa]、いい夜ですね。", translation = "Good evening, it's a nice night.", note = "final は is pronounced wa" },
  { term = "さようなら", reading = "sayounara", meaning = "goodbye", pos = "phrase", sentence = "先生、[さようなら|sayounara]。", translation = "Goodbye, teacher." },
  { term = "ありがとう", reading = "arigatou", meaning = "thank you", pos = "phrase", sentence = "手伝ってくれて[ありがとう|arigatou]。", translation = "Thank you for helping me." },
  { term = "すみません", reading = "sumimasen", meaning = "excuse me / I'm sorry", pos = "phrase", sentence = "[すみません|sumimasen]、駅はどこですか。", translation = "Excuse me, where is the station?" },
  { term = "お願いします", reading = "おねがいします · onegaishimasu", meaning = "please (when requesting)", pos = "phrase", sentence = "コーヒーを一つ[お願いします|おねがいします|onegaishimasu]。", translation = "One coffee, please." },
  { term = "いただきます", reading = "itadakimasu", meaning = "said before eating (thanks for the food)", pos = "phrase", sentence = "みんなで「[いただきます|itadakimasu]」と言いました。", translation = "Everyone said 'itadakimasu' together." },
  { term = "ごちそうさまでした", reading = "gochisousama deshita", meaning = "said after eating (thank you for the meal)", pos = "phrase", sentence = "とてもおいしかったです。[ごちそうさまでした|gochisousama deshita]。", translation = "It was delicious. Thank you for the meal." },
  { term = "人", reading = "ひと · hito", meaning = "person / people", pos = "noun", sentence = "この町の[人|ひと|hito]はみんな優しいです。", translation = "The people in this town are all kind." },
  { term = "友達", reading = "ともだち · tomodachi", meaning = "friend", pos = "noun", sentence = "週末、[友達|ともだち|tomodachi]と遊びます。", translation = "I hang out with friends on the weekend." },
  { term = "先生", reading = "せんせい · sensei", meaning = "teacher / doctor (title)", pos = "noun", sentence = "私の[先生|せんせい|sensei]はとても優しいです。", translation = "My teacher is very kind." },
  { term = "学生", reading = "がくせい · gakusei", meaning = "student", pos = "noun", sentence = "兄は大学の[学生|がくせい|gakusei]です。", translation = "My older brother is a university student." },
  { term = "家", reading = "いえ · ie", meaning = "house / home", pos = "noun", sentence = "私の[家|いえ|ie]は駅の近くです。", translation = "My house is near the station." },
  { term = "学校", reading = "がっこう · gakkou", meaning = "school", pos = "noun", sentence = "歩いて[学校|がっこう|gakkou]に行きます。", translation = "I walk to school." },
  { term = "会社", reading = "かいしゃ · kaisha", meaning = "company / office", pos = "noun", sentence = "父は[会社|かいしゃ|kaisha]で働いています。", translation = "My father works at a company." },
  { term = "仕事", reading = "しごと · shigoto", meaning = "work / job", pos = "noun", sentence = "[仕事|しごと|shigoto]は五時に終わります。", translation = "Work ends at five." },
  { term = "水", reading = "みず · mizu", meaning = "water", pos = "noun", sentence = "[水|みず|mizu]を一杯ください。", translation = "A glass of water, please." },
  { term = "ご飯", reading = "ごはん · gohan", meaning = "cooked rice / meal", pos = "noun", sentence = "一緒に[ご飯|ごはん|gohan]を食べましょう。", translation = "Let's eat together." },
  { term = "お金", reading = "おかね · okane", meaning = "money", pos = "noun", sentence = "[お金|おかね|okane]がありません。", translation = "I have no money." },
  { term = "時間", reading = "じかん · jikan", meaning = "time", pos = "noun", sentence = "今日は[時間|じかん|jikan]がありません。", translation = "I don't have time today." },
