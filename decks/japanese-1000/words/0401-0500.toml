words = [
  { term = "町", reading = "まち · machi", meaning = "town", pos = "noun", sentence = "この[町|まち|machi]は静かです。", translation = "This town is quiet." },
  { term = "村", reading = "むら · mura", meaning = "village", pos = "noun", sentence = "祖母は小さい[村|むら|mura]に住んでいます。", translation = "My grandmother lives in a small village." },
  { term = "国", reading = "くに · kuni", meaning = "country / home country", pos = "noun", sentence = "どこの[国|くに|kuni]から来ましたか。", translation = "Which country are you from?" },
  { term = "外国", reading = "がいこく · gaikoku", meaning = "foreign country / abroad", pos = "noun", sentence = "[外国|がいこく|gaikoku]に住みたいです。", translation = "I want to live abroad." },
  { term = "外国人", reading = "がいこくじん · gaikokujin", meaning = "foreigner", pos = "noun", sentence = "この町には[外国人|がいこくじん|gaikokujin]が多いです。", translation = "There are many foreigners in this town." },
  { term = "道", reading = "みち · michi", meaning = "road / way / route", pos = "noun", sentence = "駅までの[道|みち|michi]を教えてください。", translation = "Please tell me the way to the station." },
  { term = "病院", reading = "びょういん · byouin", meaning = "hospital / clinic", pos = "noun", sentence = "[病院|びょういん|byouin]に行きました。", translation = "I went to the hospital." },
  { term = "銀行", reading = "ぎんこう · ginkou", meaning = "bank", pos = "noun", sentence = "[銀行|ぎんこう|ginkou]でお金をおろします。", translation = "I withdraw money at the bank." },
  { term = "郵便局", reading = "ゆうびんきょく · yuubinkyoku", meaning = "post office", pos = "noun", sentence = "[郵便局|ゆうびんきょく|yuubinkyoku]で切手を買いました。", translation = "I bought stamps at the post office." },
  { term = "図書館", reading = "としょかん · toshokan", meaning = "library", pos = "noun", sentence = "[図書館|としょかん|toshokan]は九時に開きます。", translation = "The library opens at nine." },
  { term = "大学", reading = "だいがく · daigaku", meaning = "university / college", pos = "noun", sentence = "姉は[大学|だいがく|daigaku]に通っています。", translation = "My older sister goes to university." },
  { term = "公園", reading = "こうえん · kouen", meaning = "park", pos = "noun", sentence = "[公園|こうえん|kouen]で犬と遊びます。", translation = "I play with my dog in the park." },
  { term = "スーパー", reading = "suupaa", meaning = "supermarket", pos = "noun", sentence = "[スーパー|suupaa]で牛乳を買います。", translation = "I buy milk at the supermarket." },
  { term = "コンビニ", reading = "konbini", meaning = "convenience store", pos = "noun", sentence = "[コンビニ|konbini]は二十四時間開いています。", translation = "Convenience stores are open 24 hours." },
  { term = "デパート", reading = "depaato", meaning = "department store", pos = "noun", sentence = "[デパート|depaato]で母のプレゼントを買いました。", translation = "I bought a present for my mother at the department store." },
  { term = "ホテル", reading = "hoteru", meaning = "hotel", pos = "noun", sentence = "駅の近くの[ホテル|hoteru]に泊まります。", translation = "I'm staying at a hotel near the station." },
  { term = "空港", reading = "くうこう · kuukou", meaning = "airport", pos = "noun", sentence = "[空港|くうこう|kuukou]まで電車で行きます。", translation = "I'll go to the airport by train." },
  { term = "教室", reading = "きょうしつ · kyoushitsu", meaning = "classroom", pos = "noun", sentence = "[教室|きょうしつ|kyoushitsu]に学生が二十人います。", translation = "There are twenty students in the classroom." },
  { term = "事務所", reading = "じむしょ · jimusho", meaning = "office (workplace)", pos = "noun", sentence = "[事務所|じむしょ|jimusho]で書類を書きます。", translation = "I write documents at the office." },
  { term = "建物", reading = "たてもの · tatemono", meaning = "building", pos = "noun", sentence = "あの[建物|たてもの|tatemono]は図書館です。", translation = "That building is a library." },
  { term = "映画館", reading = "えいがかん · eigakan", meaning = "movie theater", pos = "noun", sentence = "[映画館|えいがかん|eigakan]で映画を見ました。", translation = "I watched a movie at the cinema." },
  { term = "美術館", reading = "びじゅつかん · bijutsukan", meaning = "art museum", pos = "noun", sentence = "日曜日に[美術館|びじゅつかん|bijutsukan]へ行きます。", translation = "I'll go to the art museum on Sunday." },
  { term = "お寺", reading = "おてら · otera", meaning = "Buddhist temple", pos = "noun", sentence = "古い[お寺|おてら|otera]を見に行きました。", translation = "I went to see an old temple." },
  { term = "神社", reading = "じんじゃ · jinja", meaning = "Shinto shrine", pos = "noun", sentence = "お正月に[神社|じんじゃ|jinja]へ行きます。", translation = "I go to a shrine at New Year's." },
  { term = "交番", reading = "こうばん · kouban", meaning = "police box", pos = "noun", sentence = "[交番|こうばん|kouban]で道を聞きました。", translation = "I asked for directions at the police box." },
  { term = "入口", reading = "いりぐち · iriguchi", meaning = "entrance", pos = "noun", sentence = "[入口|いりぐち|iriguchi]で待っています。", translation = "I'm waiting at the entrance." },
  { term = "出口", reading = "でぐち · deguchi", meaning = "exit", pos = "noun", sentence = "東[出口|でぐち|deguchi]で会いましょう。", translation = "Let's meet at the east exit." },
  { term = "階段", reading = "かいだん · kaidan", meaning = "stairs", pos = "noun", sentence = "[階段|かいだん|kaidan]を上ります。", translation = "I go up the stairs." },
  { term = "エレベーター", reading = "erebeetaa", meaning = "elevator", pos = "noun", sentence = "[エレベーター|erebeetaa]で五階に行きます。", translation = "I take the elevator to the fifth floor." },
  { term = "玄関", reading = "げんかん · genkan", meaning = "entryway (of a home)", pos = "noun", sentence = "[玄関|げんかん|genkan]で靴を脱ぎます。", translation = "I take off my shoes in the entryway." },
  { term = "庭", reading = "にわ · niwa", meaning = "garden / yard", pos = "noun", sentence = "家に小さい[庭|にわ|niwa]があります。", translation = "My house has a small garden." },
  { term = "電車", reading = "でんしゃ · densha", meaning = "train", pos = "noun", sentence = "[電車|でんしゃ|densha]で会社に行きます。", translation = "I go to work by train." },
  { term = "バス", reading = "basu", meaning = "bus", pos = "noun", sentence = "[バス|basu]は十分おきに来ます。", translation = "The bus comes every ten minutes." },
  { term = "車", reading = "くるま · kuruma", meaning = "car", pos = "noun", sentence = "父は[車|くるま|kuruma]で会社に行きます。", translation = "My father drives to work." },
  { term = "自転車", reading = "じてんしゃ · jitensha", meaning = "bicycle", pos = "noun", sentence = "[自転車|じてんしゃ|jitensha]で学校に行きます。", translation = "I go to school by bicycle." },
  { term = "タクシー", reading = "takushii", meaning = "taxi", pos = "noun", sentence = "[タクシー|takushii]を呼んでください。", translation = "Please call a taxi." },
  { term = "飛行機", reading = "ひこうき · hikouki", meaning = "airplane", pos = "noun", sentence = "[飛行機|ひこうき|hikouki]で北海道に行きます。", translation = "I'll fly to Hokkaido." },
  { term = "地下鉄", reading = "ちかてつ · chikatetsu", meaning = "subway", pos = "noun", sentence = "次の駅で[地下鉄|ちかてつ|chikatetsu]に乗り換えます。", translation = "I transfer to the subway at the next station." },
  { term = "船", reading = "ふね · fune", meaning = "ship / boat", pos = "noun", sentence = "[船|ふね|fune]で島に行きました。", translation = "I went to the island by boat." },
  { term = "切符", reading = "きっぷ · kippu", meaning = "ticket", pos = "noun", sentence = "駅で[切符|きっぷ|kippu]を買います。", translation = "I buy a ticket at the station." },
  { term = "乗る", reading = "のる · noru", meaning = "to ride / to get on", pos = "verb", sentence = "毎朝バスに[乗ります|のります|norimasu]。", translation = "I take the bus every morning.", note = "u-verb · polite: 乗ります · takes に" },
  { term = "降りる", reading = "おりる · oriru", meaning = "to get off (a vehicle)", pos = "verb", sentence = "次の駅で[降ります|おります|orimasu]。", translation = "I'm getting off at the next station.", note = "ru-verb · polite: 降ります" },
  { term = "歩く", reading = "あるく · aruku", meaning = "to walk", pos = "verb", sentence = "毎日三十分[歩きます|あるきます|arukimasu]。", translation = "I walk for thirty minutes every day.", note = "u-verb · polite: 歩きます" },
  { term = "走る", reading = "はしる · hashiru", meaning = "to run", pos = "verb", sentence = "毎朝公園を[走ります|はしります|hashirimasu]。", translation = "I run in the park every morning.", note = "u-verb (despite -iru) · polite: 走ります" },
  { term = "着く", reading = "つく · tsuku", meaning = "to arrive", pos = "verb", sentence = "七時に駅に[着きました|つきました|tsukimashita]。", translation = "I arrived at the station at seven.", note = "u-verb · polite: 着きます" },
  { term = "出る", reading = "でる · deru", meaning = "to leave / to go out / to appear", pos = "verb", sentence = "八時に家を[出ます|でます|demasu]。", translation = "I leave home at eight.", note = "ru-verb · polite: 出ます" },
  { term = "入る", reading = "はいる · hairu", meaning = "to enter / to go in", pos = "verb", sentence = "部屋に[入って|はいって|haitte]ください。", translation = "Please come into the room.", note = "u-verb (despite -iru) · polite: 入ります" },
  { term = "出かける", reading = "でかける · dekakeru", meaning = "to go out (on an outing)", pos = "verb", sentence = "日曜日は家族と[出かけます|でかけます|dekakemasu]。", translation = "I go out with my family on Sundays.", note = "ru-verb · polite: 出かけます" },
  { term = "急ぐ", reading = "いそぐ · isogu", meaning = "to hurry", pos = "verb", sentence = "時間がないので[急いで|いそいで|isoide]ください。", translation = "There's no time, so please hurry.", note = "u-verb · te-form: 急いで" },
  { term = "遅れる", reading = "おくれる · okureru", meaning = "to be late / to be delayed", pos = "verb", sentence = "電車が十分[遅れました|おくれました|okuremashita]。", translation = "The train was ten minutes late.", note = "ru-verb · polite: 遅れます" },
  { term = "曲がる", reading = "まがる · magaru", meaning = "to turn (a corner)", pos = "verb", sentence = "次の角を右に[曲がって|まがって|magatte]ください。", translation = "Please turn right at the next corner.", note = "u-verb · polite: 曲がります" },
  { term = "渡る", reading = "わたる · wataru", meaning = "to cross (over)", pos = "verb", sentence = "橋を[渡ります|わたります|watarimasu]。", translation = "I cross the bridge.", note = "u-verb · polite: 渡ります" },
  { term = "橋", reading = "はし · hashi", meaning = "bridge", pos = "noun", sentence = "あの[橋|はし|hashi]は古いです。", translation = "That bridge is old." },
  { term = "角", reading = "かど · kado", meaning = "corner", pos = "noun", sentence = "あの[角|かど|kado]に銀行があります。", translation = "There's a bank on that corner." },
  { term = "信号", reading = "しんごう · shingou", meaning = "traffic light", pos = "noun", sentence = "[信号|しんごう|shingou]が赤です。", translation = "The traffic light is red." },
  { term = "地図", reading = "ちず · chizu", meaning = "map", pos = "noun", sentence = "[地図|ちず|chizu]を見せてください。", translation = "Please show me the map." },
  { term = "旅行", reading = "りょこう · ryokou", meaning = "travel / trip", pos = "noun", sentence = "夏に[旅行|りょこう|ryokou]に行きます。", translation = "I'll go on a trip in the summer.", note = "する-verb: 旅行する" },
  { term = "右", reading = "みぎ · migi", meaning = "right (direction)", pos = "noun", sentence = "銀行は[右|みぎ|migi]にあります。", translation = "The bank is on the right." },
  { term = "左", reading = "ひだり · hidari", meaning = "left (direction)", pos = "noun", sentence = "[左|ひだり|hidari]に曲がってください。", translation = "Please turn left." },
  { term = "上", reading = "うえ · ue", meaning = "up / above / on top", pos = "noun", sentence = "机の[上|うえ|ue]に本があります。", translation = "There's a book on the desk." },
  { term = "下", reading = "した · shita", meaning = "down / below / under", pos = "noun", sentence = "猫がいすの[下|した|shita]にいます。", translation = "The cat is under the chair." },
  { term = "中", reading = "なか · naka", meaning = "inside / middle", pos = "noun", sentence = "かばんの[中|なか|naka]に何がありますか。", translation = "What's in the bag?" },
  { term = "外", reading = "そと · soto", meaning = "outside", pos = "noun", sentence = "[外|そと|soto]は寒いです。", translation = "It's cold outside." },
  { term = "後ろ", reading = "うしろ · ushiro", meaning = "behind / back", pos = "noun", sentence = "家の[後ろ|うしろ|ushiro]に山があります。", translation = "There's a mountain behind the house." },
  { term = "横", reading = "よこ · yoko", meaning = "side / beside", pos = "noun", sentence = "テレビの[横|よこ|yoko]に時計があります。", translation = "There's a clock beside the TV." },
  { term = "近く", reading = "ちかく · chikaku", meaning = "vicinity / nearby", pos = "noun", sentence = "家の[近く|ちかく|chikaku]にコンビニがあります。", translation = "There's a convenience store near my house." },
  { term = "間", reading = "あいだ · aida", meaning = "between / interval", pos = "noun", sentence = "銀行と郵便局の[間|あいだ|aida]に花屋があります。", translation = "There's a flower shop between the bank and the post office." },
  { term = "向こう", reading = "むこう · mukou", meaning = "the other side / over there", pos = "noun", sentence = "川の[向こう|むこう|mukou]に学校があります。", translation = "There's a school across the river." },
  { term = "東", reading = "ひがし · higashi", meaning = "east", pos = "noun", sentence = "太陽は[東|ひがし|higashi]から昇ります。", translation = "The sun rises in the east." },
  { term = "西", reading = "にし · nishi", meaning = "west", pos = "noun", sentence = "太陽は[西|にし|nishi]に沈みます。", translation = "The sun sets in the west." },
  { term = "南", reading = "みなみ · minami", meaning = "south", pos = "noun", sentence = "冬は[南|みなみ|minami]の島に行きたいです。", translation = "In winter I want to go to a southern island." },
  { term = "北", reading = "きた · kita", meaning = "north", pos = "noun", sentence = "駅の[北|きた|kita]に公園があります。", translation = "There's a park north of the station." },
  { term = "近い", reading = "ちかい · chikai", meaning = "near / close", pos = "adjective", sentence = "家は駅から[近い|ちかい|chikai]です。", translation = "My house is close to the station.", note = "i-adjective" },
  { term = "遠い", reading = "とおい · tooi", meaning = "far", pos = "adjective", sentence = "学校は家から[遠い|とおい|tooi]です。", translation = "School is far from my house.", note = "i-adjective" },
  { term = "まっすぐ", reading = "massugu", meaning = "straight (ahead)", pos = "adverb", sentence = "この道を[まっすぐ|massugu]行ってください。", translation = "Please go straight along this road." },
  { term = "こちら", reading = "kochira", meaning = "this way / this person (polite)", pos = "pronoun", sentence = "[こちら|kochira]は田中さんです。", translation = "This is Mr. Tanaka." },
  { term = "そちら", reading = "sochira", meaning = "that way / your side (polite)", pos = "pronoun", sentence = "[そちら|sochira]の天気はどうですか。", translation = "How is the weather where you are?" },
  { term = "あちら", reading = "achira", meaning = "that way over there (polite)", pos = "pronoun", sentence = "出口は[あちら|achira]です。", translation = "The exit is over there." },
  { term = "どちら", reading = "dochira", meaning = "which (of two) / where (polite)", pos = "pronoun", sentence = "コーヒーと紅茶、[どちら|dochira]がいいですか。", translation = "Which would you like, coffee or tea?" },
  { term = "この", reading = "kono", meaning = "this (+ noun)", pos = "pronoun", sentence = "[この|kono]かばんは誰のですか。", translation = "Whose bag is this?", note = "pre-noun form, always followed by a noun" },
  { term = "その", reading = "sono", meaning = "that (+ noun, near you)", pos = "pronoun", sentence = "[その|sono]映画はもう見ました。", translation = "I've already seen that movie.", note = "pre-noun form" },
  { term = "あの", reading = "ano", meaning = "that (+ noun, over there)", pos = "pronoun", sentence = "[あの|ano]人は私の先生です。", translation = "That person over there is my teacher.", note = "pre-noun form" },
  { term = "どの", reading = "dono", meaning = "which (+ noun)", pos = "pronoun", sentence = "[どの|dono]電車に乗りますか。", translation = "Which train do you take?", note = "pre-noun form" },
  { term = "場所", reading = "ばしょ · basho", meaning = "location / venue", pos = "noun", sentence = "会議の[場所|ばしょ|basho]はどこですか。", translation = "Where is the meeting being held?" },
  { term = "所", reading = "ところ · tokoro", meaning = "place / spot", pos = "noun", sentence = "静かな[所|ところ|tokoro]に住みたいです。", translation = "I want to live in a quiet place." },
  { term = "住所", reading = "じゅうしょ · juusho", meaning = "address", pos = "noun", sentence = "ここに[住所|じゅうしょ|juusho]を書いてください。", translation = "Please write your address here." },
  { term = "田舎", reading = "いなか · inaka", meaning = "countryside / rural hometown", pos = "noun", sentence = "夏休みに[田舎|いなか|inaka]へ帰ります。", translation = "I'll go back to my hometown in the countryside during summer vacation." },
  { term = "都会", reading = "とかい · tokai", meaning = "city / urban area", pos = "noun", sentence = "[都会|とかい|tokai]の生活は便利です。", translation = "City life is convenient." },
  { term = "海", reading = "うみ · umi", meaning = "sea / ocean", pos = "noun", sentence = "[海|うみ|umi]が見える部屋に泊まりました。", translation = "I stayed in a room with an ocean view." },
  { term = "山", reading = "やま · yama", meaning = "mountain", pos = "noun", sentence = "週末に[山|やま|yama]に登ります。", translation = "I climb mountains on weekends." },
  { term = "川", reading = "かわ · kawa", meaning = "river", pos = "noun", sentence = "この[川|かわ|kawa]はとてもきれいです。", translation = "This river is very clean." },
  { term = "島", reading = "しま · shima", meaning = "island", pos = "noun", sentence = "沖縄には[島|しま|shima]がたくさんあります。", translation = "There are many islands in Okinawa." },
  { term = "池", reading = "いけ · ike", meaning = "pond", pos = "noun", sentence = "[池|いけ|ike]に魚がいます。", translation = "There are fish in the pond." },
  { term = "森", reading = "もり · mori", meaning = "forest / woods", pos = "noun", sentence = "[森|もり|mori]の中を散歩しました。", translation = "I took a walk in the forest." },
  { term = "空", reading = "そら · sora", meaning = "sky", pos = "noun", sentence = "[空|そら|sora]がとてもきれいです。", translation = "The sky is very beautiful." },
  { term = "道路", reading = "どうろ · douro", meaning = "road (paved) / roadway", pos = "noun", sentence = "[道路|どうろ|douro]が渋滞しています。", translation = "The road is jammed." },
  { term = "運転", reading = "うんてん · unten", meaning = "driving", pos = "noun", sentence = "父は[運転|うんてん|unten]が上手です。", translation = "My father is a good driver.", note = "する-verb: 運転する" },
  { term = "散歩", reading = "さんぽ · sanpo", meaning = "walk / stroll", pos = "noun", sentence = "公園を[散歩|さんぽ|sanpo]しましょう。", translation = "Let's take a walk in the park.", note = "する-verb: 散歩する" },
  { term = "引っ越す", reading = "ひっこす · hikkosu", meaning = "to move (house)", pos = "verb", sentence = "来月、東京に[引っ越します|ひっこします|hikkoshimasu]。", translation = "I'm moving to Tokyo next month.", note = "u-verb · polite: 引っ越します" },
  { term = "帰国", reading = "きこく · kikoku", meaning = "returning to one's home country", pos = "noun", sentence = "夏に[帰国|きこく|kikoku]します。", translation = "I'm returning to my home country in the summer.", note = "する-verb: 帰国する" },
]
