words = [
  { term = "だから", reading = "dakara", meaning = "so / therefore", pos = "conjunction", sentence = "雨です。[だから|dakara]、家にいます。", translation = "It's raining. So I'm staying home.", note = "polite: ですから" },
  { term = "それから", reading = "sorekara", meaning = "after that / and then", pos = "conjunction", sentence = "宿題をしました。[それから|sorekara]、寝ました。", translation = "I did my homework. After that, I went to bed." },
  { term = "しかし", reading = "shikashi", meaning = "however (formal)", pos = "conjunction", sentence = "日本語は難しいです。[しかし|shikashi]、面白いです。", translation = "Japanese is difficult. However, it's interesting." },
  { term = "けれども", reading = "keredomo", meaning = "but / although", pos = "conjunction", sentence = "行きたいです。[けれども|keredomo]、時間がありません。", translation = "I want to go. But I don't have time.", note = "casual: けど" },
